# Reinforcement learning configuration for MatterGen model

Global:
  do_train: True
  output_dir: ./output/mattergen_rl

Model:
  __class_name__: MatterGen
  __init_params__:
    # #ISPL-TODO: Add model-specific parameters
    hidden_dim: 256
    num_layers: 6
    num_heads: 8

RL:
  rl_epoch: 50
  topk_ratio: 0.5
  save_freq: 10

  sample_cfg:
    batch_size: 16
    num_batches: 4
    num_samples: 64
    # #ISPL-TODO: Add sampling parameters

  finetune_cfg:
    batch_size: 8
    lr: 0.0005
    epochs: 2
    timesteps: 100
    accum_steps: 4
    sigma: 1.0

  reward_cfg:
    reward_threshold: 0.5
    reduce: mean
    prop_cfg:
      # #ISPL-TODO: Configure property calculators
      - name: band_gap
        target: ascending
        minv: 0.0
        maxv: 5.0
        calculator:
          __class_name__: PropertyCalculator
          # #ISPL-TODO: Add calculator parameters

  replay_cfg:
    capacity: 1000
    sample_size: 32
    buffer_size: 100
    reward_cutoff: 0.0

  div_filter_cfg:
    enabled: true
    tol: 10
    buff: 20
    method: composition

Trainer:
  # #ISPL-TODO: Configure trainer parameters
  max_epochs: 100
  log_freq: 10
